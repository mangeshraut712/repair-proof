name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -q
      - run: RP_ENABLE_LIVE=0 RP_ENABLE_SANDBOX=0 python -m repair_proof.evaluate
      - run: python scripts/verify_evaluations.py
      - run: python scripts/verify_manifest.py
      - run: python -m py_compile repair_proof/packet_verifier.py scripts/verify_packet.py
      - run: node --check web/app.js
      - run: git diff --check
