name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --no-cache-dir -r requirements.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -q
      - run: python -m repair_proof.evaluate
      - run: |
          python - <<'PY'
          from repair_proof.evaluate import evaluate

          report = evaluate(include_holdouts=True)
          expected = {
              'cases': 20,
              'repairable_policy_acceptance': {'accepted': 12, 'total': 12},
              'unsafe_rejection': {'rejected': 8, 'total': 8},
              'citation_reference_validity': {'valid': 20, 'total': 20},
          }
          observed = {key: report[key] for key in expected}
          if observed != expected:
              raise SystemExit(f"Unexpected holdout evaluation: {observed}")
          print("Holdout evaluation assertions passed.")
          PY
      - run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd().resolve()
          entries = json.loads((root / "SOURCE_MANIFEST.json").read_text())["files_sha256"]
          tracked = set(
              subprocess.run(["git", "ls-files"], check=True, capture_output=True, text=True).stdout.splitlines()
          )
          expected_paths = tracked - {"SOURCE_MANIFEST.json"}
          manifest_paths = set(entries)
          if manifest_paths != expected_paths:
              missing = sorted(expected_paths - manifest_paths)
              extra = sorted(manifest_paths - expected_paths)
              raise SystemExit(f"Manifest file-set mismatch; missing={missing}; extra={extra}")
          mismatches = []
          for relative, expected in entries.items():
              candidate = (root / relative).resolve()
              if not candidate.is_relative_to(root) or not candidate.is_file():
                  mismatches.append(relative)
              elif hashlib.sha256(candidate.read_bytes()).hexdigest() != expected:
                  mismatches.append(relative)
          if mismatches:
              raise SystemExit("Manifest mismatches: " + ", ".join(mismatches))
          print(f"Verified {len(entries)} manifest entries.")
          PY
      - run: node --check web/app.js
